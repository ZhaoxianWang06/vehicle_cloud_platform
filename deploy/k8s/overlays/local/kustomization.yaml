apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - mysql.yaml
  - redis.yaml
configMapGenerator:
  - name: vehicle-config
    literals:
      - HTTP_ADDR=:8080
      - REDIS_ADDR=redis:6379
      - REDIS_DB=0
      - REDIS_TLS=false
  - name: mysql-init
    files:
      - 001_schema.sql
secretGenerator:
  - name: vehicle-data
    literals:
      - MYSQL_DSN=vehicle:vehicle-lab-pass@tcp(mysql:3306)/vehicle_cloud?parseTime=true&charset=utf8mb4&loc=UTC
      - REDIS_PASSWORD=
images:
  - name: vehicle-cloud/telemetry-api
    newTag: local
  - name: vehicle-cloud/control-api
    newTag: local
