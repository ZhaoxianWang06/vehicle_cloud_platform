apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-api
  labels:
    app.kubernetes.io/name: telemetry-api
    app.kubernetes.io/part-of: vehicle-cloud
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: telemetry-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telemetry-api
        app.kubernetes.io/part-of: vehicle-cloud
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: telemetry-api
      terminationGracePeriodSeconds: 20
      containers:
        - name: telemetry-api
          image: vehicle-cloud/telemetry-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: vehicle-config
            - secretRef:
                name: vehicle-data
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry-api
  labels:
    app.kubernetes.io/name: telemetry-api
    app.kubernetes.io/part-of: vehicle-cloud
spec:
  selector:
    app.kubernetes.io/name: telemetry-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: telemetry-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: telemetry-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
