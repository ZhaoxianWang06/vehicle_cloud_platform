apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-api
  labels:
    app.kubernetes.io/name: control-api
    app.kubernetes.io/part-of: vehicle-cloud
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: control-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control-api
        app.kubernetes.io/part-of: vehicle-cloud
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: control-api
      terminationGracePeriodSeconds: 25
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: control-api
      containers:
        - name: control-api
          image: vehicle-cloud/control-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: vehicle-config
            - secretRef:
                name: vehicle-data
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: control-api
  labels:
    app.kubernetes.io/name: control-api
    app.kubernetes.io/part-of: vehicle-cloud
spec:
  selector:
    app.kubernetes.io/name: control-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: control-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: control-api
