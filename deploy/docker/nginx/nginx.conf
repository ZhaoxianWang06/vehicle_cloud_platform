worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
}

http {
    # 车况是高 QPS，车控是低 QPS。限流按这个差别拆开，避免上报把车控通道挤掉。
    limit_req_zone $binary_remote_addr zone=telemetry:10m rate=200r/s;
    limit_req_zone $binary_remote_addr zone=control:10m rate=50r/s;
    limit_req_status 429;

    log_format json_combined escape=json
        '{"ts":"$time_iso8601","service":"nginx","method":"$request_method","path":"$uri","status":$status,'
        '"bytes":$body_bytes_sent,"request_time":$request_time,"upstream":"$upstream_addr",'
        '"upstream_time":"$upstream_response_time","request_id":"$request_id"}';

    access_log /dev/stdout json_combined;
    error_log  /dev/stderr warn;
    server_tokens off;
    client_max_body_size 1m;

    upstream telemetry_api {
        server telemetry-api:8080;
        keepalive 32;
    }

    upstream control_api {
        server control-api:8080;
        keepalive 32;
    }

    server {
        listen 80;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location /api/v1/telemetry {
            limit_req zone=telemetry burst=400 nodelay;
            proxy_pass http://telemetry_api;
            include /etc/nginx/proxy_params;
        }

        # 比 /api/v1/vehicles/ 更具体，车控列表不能被车况服务接走。
        location ~ ^/api/v1/vehicles/[A-Za-z0-9]+/commands {
            limit_req zone=control burst=40 nodelay;
            proxy_pass http://control_api;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/commands {
            limit_req zone=control burst=80 nodelay;
            proxy_pass http://control_api;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/vehicles/ {
            limit_req zone=telemetry burst=200 nodelay;
            proxy_pass http://telemetry_api;
            include /etc/nginx/proxy_params;
        }

        location / {
            default_type application/json;
            return 404 '{"code":40400,"message":"not found"}\n';
        }
    }

    # stub_status 只给同网络里的 exporter，不映射到宿主机。
    server {
        listen 8081;
        access_log off;

        location /stub_status {
            stub_status;
        }
    }
}
