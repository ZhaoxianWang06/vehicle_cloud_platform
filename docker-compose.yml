name: vehicle-cloud

# 本地实验口令，只存在于这台机器的 Compose 网络里。
x-lab-dsn: &lab-dsn "vehicle:vehicle-lab-pass@tcp(mysql:3306)/vehicle_cloud?parseTime=true&charset=utf8mb4&loc=UTC"

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: vehicle-root-pass
      MYSQL_DATABASE: vehicle_cloud
      MYSQL_USER: vehicle
      MYSQL_PASSWORD: vehicle-lab-pass
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  telemetry-api:
    build:
      context: .
      dockerfile: apps/telemetry-api/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        GOSUMDB: ${GOSUMDB:-sum.golang.org}
        GO_BASE: ${GO_BASE:-golang:1.22-alpine}
        RUNTIME_BASE: ${RUNTIME_BASE:-alpine:3.20}
    environment:
      HTTP_ADDR: ":8080"
      MYSQL_DSN: *lab-dsn
      REDIS_ADDR: redis:6379
      REDIS_DB: "0"
      REDIS_TLS: "false"
    ports:
      - "18081:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  control-api:
    build:
      context: .
      dockerfile: apps/control-api/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        GOSUMDB: ${GOSUMDB:-sum.golang.org}
        GO_BASE: ${GO_BASE:-golang:1.22-alpine}
        RUNTIME_BASE: ${RUNTIME_BASE:-alpine:3.20}
    environment:
      HTTP_ADDR: ":8080"
      MYSQL_DSN: *lab-dsn
      REDIS_ADDR: redis:6379
      REDIS_DB: "0"
      REDIS_TLS: "false"
    ports:
      - "18082:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/docker/nginx/proxy_params:/etc/nginx/proxy_params:ro
    ports:
      - "18080:80"
    depends_on:
      telemetry-api:
        condition: service_healthy
      control-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    environment:
      DATA_SOURCE_NAME: "exporter:exporter-lab-pass@(mysql:3306)/"
    depends_on:
      mysql:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    environment:
      REDIS_ADDR: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    command: ["--nginx.scrape-uri=http://nginx:8081/stub_status"]
    depends_on:
      - nginx

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-lifecycle"
    volumes:
      - ./deploy/observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - telemetry-api
      - control-api
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    volumes:
      - ./deploy/observability/alertmanager:/etc/alertmanager:ro
    ports:
      - "9093:9093"

  loki:
    image: grafana/loki:3.1.1
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./deploy/observability/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:3.1.1
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./deploy/observability/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki

volumes:
  mysql-data:
  redis-data:
  prometheus-data:
  loki-data:
  grafana-data:
