---
- name: Install ingress and the local overlay
  hosts: masters
  become: true
  tasks:
    - name: ingress-nginx
      ansible.builtin.command: "kubectl apply -f {{ ingress_nginx_manifest }}"
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      when: inventory_hostname == groups['masters'][0]
      changed_when: true

    - name: copy manifests
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../deploy/k8s/"
        dest: /opt/vehicle-cloud/k8s/
      when: inventory_hostname == groups['masters'][0]

    - name: apply overlay
      ansible.builtin.command: "kubectl apply -k /opt/vehicle-cloud/k8s/overlays/{{ k8s_overlay }}"
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      when: inventory_hostname == groups['masters'][0]
      changed_when: true
