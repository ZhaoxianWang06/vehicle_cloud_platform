---
- name: Prepare nodes
  hosts: k8s
  become: true
  roles:
    - common
    - containerd
    - kubernetes

- name: Init the first control plane
  hosts: masters
  become: true
  tasks:
    - name: kubeadm init
      ansible.builtin.command: >-
        kubeadm init
        --pod-network-cidr={{ pod_network_cidr }}
        --apiserver-advertise-address={{ ansible_host }}
        --control-plane-endpoint={{ ansible_host }}
      args:
        creates: /etc/kubernetes/admin.conf
      when: inventory_hostname == groups['masters'][0]

    - name: root kubeconfig
      ansible.builtin.file:
        path: /root/.kube
        state: directory
        mode: "0700"
      when: inventory_hostname == groups['masters'][0]

    - name: install admin.conf for root
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        remote_src: true
        mode: "0600"
      when: inventory_hostname == groups['masters'][0]

    - name: install flannel
      ansible.builtin.command: "kubectl apply -f {{ flannel_manifest }}"
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      when: inventory_hostname == groups['masters'][0]
      changed_when: true

    - name: join command
      ansible.builtin.command: kubeadm token create --print-join-command
      register: join_command
      changed_when: false
      when: inventory_hostname == groups['masters'][0]

- name: Join workers
  hosts: workers
  become: true
  tasks:
    - name: kubeadm join
      ansible.builtin.command: "{{ hostvars[groups['masters'][0]].join_command.stdout }}"
      args:
        creates: /etc/kubernetes/kubelet.conf
